[platformio]
default_envs = pyclock_c3

[env:pyclock_c3]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
; 3 MB app, no OTA: the pre-rendered frames need the room.
board_build.partitions = huge_app.csv
build_flags = -std=gnu++17 -DARDUINO_USB_CDC_ON_BOOT=1 -DARDUINO_USB_MODE=1
lib_deps =
  adafruit/Adafruit ST7735 and ST7789 Library@^1.11.0
  bblanchon/ArduinoJson@^7.0.0

[env:color_test]
extends = env:pyclock_c3
build_flags = ${env:pyclock_c3.build_flags} -DCOLOR_TEST
